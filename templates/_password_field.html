<div>
    <label class="label-brand" for="{{ field_id }}">{{ label|default:'Password' }}</label>
    <div class="relative">
        <input type="password" id="{{ field_id }}" name="{{ field_name|default:'password' }}" class="input-brand pr-10" required>
        <i data-lucide="eye" data-target="{{ field_id }}" class="password-toggle absolute right-3 top-1/2 -translate-y-1/2 w-5 h-5 cursor-pointer text-slate-400 hover:text-brandblue transition-colors"></i>
    </div>
</div>
